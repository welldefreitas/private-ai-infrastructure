worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # No Data Retention: Disable access logs to ensure prompt privacy
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Rate Limiting: Prevent DDoS / Spam
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        location / {
            limit_req zone=ai_limit burst=10 nodelay;

            # Basic Auth to prevent unauthorized scanning
            # auth_basic "Private AI Endpoint";
            # auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://ollama:11434;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
