worker_processes auto;

events { worker_connections 1024; }

http {
  # Security: do not leak version
  server_tokens off;

  # Basic request rate limiting (anti-spam / brute force)
  limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;

  server {
    listen 80;
    server_name localhost;

    # Security headers (baseline)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Optional: block large payloads (basic DoS protection)
    client_max_body_size 2m;

    location / {
      # Apply rate limiting
      limit_req zone=ai_limit burst=10 nodelay;

      # Reverse proxy to isolated LLM engine
      proxy_pass http://ollama:11434;

      # Preserve source details
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Timeouts (avoid hanging connections)
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}
