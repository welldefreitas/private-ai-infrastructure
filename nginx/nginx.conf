worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Security: Hide Nginx version
    server_tokens off;

    # Privacy: Disable access logs to prevent prompt leakage
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # DDoS Mitigation: Rate limit zone definition
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;

    # Force HTTPS: Redirect all HTTP traffic to secure port
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # Secure HTTPS Server Configuration
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Strict Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # API Endpoint: Rate-limited and proxied to the isolated LLM engine
        location /api/ {
            limit_req zone=ai_limit burst=10 nodelay;
            proxy_pass http://ollama:11434/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Default Deny: Drop all unhandled requests
        location / {
            return 404;
        }
    }
}
