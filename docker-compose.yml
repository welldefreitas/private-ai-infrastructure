version: '3.8'

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: private_llm_engine
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_secure_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: ai_proxy
    restart: always
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - ai_secure_net
      - public_proxy_net
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "https://localhost/api/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ai_secure_net:
    internal: true 
  public_proxy_net:
    driver: bridge

volumes:
  ollama_data:
