version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: private_llm_engine
    restart: unless-stopped
    # No exposed ports to the host -> 100% isolated. Nginx handles external access.
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_secure_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nginx:
    image: nginx:alpine
    container_name: ai_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - ai_secure_net
    depends_on:
      - ollama

networks:
  ai_secure_net:
    driver: bridge

volumes:
  ollama_data:
