name: Enterprise CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least privilege for the GitHub token (required for SARIF upload)
permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_security:
    name: Lint + Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fast sanity checks (fail early if critical files are missing)
      - name: Validate repository layout
        run: |
          set -euo pipefail
          test -f docker-compose.yml
          test -d nginx
          test -d scripts
          echo "Repo layout OK."

      # GitHub Actions workflow lint (catches YAML + actions mistakes)
      - name: actionlint (GitHub Actions linter)
        uses: rhysd/actionlint@v1
        with:
          fail-on-error: true

      # YAML lint (compose, workflows, configs)
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy: disable

      # Shell script lint (scripts/*.sh)
      - name: ShellCheck (bash scripts)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "scripts"

      # Secrets scan (block accidental credential leaks)
      - name: Gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "--redact --verbose --exit-code=1"

      # IaC / misconfiguration scanning (compose/yaml/k8s/terraform/etc.)
      - name: Checkov (IaC misconfig scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: all
          quiet: true
          soft_fail: false

      # Trivy config scan -> SARIF (shows results in GitHub Security tab)
      - name: Trivy - config scan (misconfigurations)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-config.sarif"

      # Upload SARIF only when it has permissions (avoids fork PR issues)
      - name: Upload Trivy config SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-config.sarif"

      # Optional: SBOM for enterprise/compliance (artifact)
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

  smoke_compose:
    name: Compose Smoke Test (CI-safe)
    runs-on: ubuntu-latest
    needs: lint_security
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI runners have no NVIDIA GPU. Remove GPU reservation just for CI validation.
      - name: Create CI override (no GPU)
        run: |
          set -euo pipefail
          cat > docker-compose.ci.override.yml <<'YAML'
          services:
            ollama:
              deploy: {}
          YAML

      # Validates docker-compose syntax after merging override
      - name: Docker Compose config validation
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml config >/dev/null
          echo "Compose config is valid."

      # Nginx config test inside container (fast + reliable)
      - name: Nginx config test (container)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine nginx -t
          echo "Nginx config OK."
