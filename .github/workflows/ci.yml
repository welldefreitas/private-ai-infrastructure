name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Principle of least privilege for GitHub token
permissions:
  contents: read
  security-events: write # needed for SARIF upload (Code Scanning)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    name: Lint + Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Quick sanity: avoid "works on my machine" by enforcing expected files
      - name: Validate repository layout
        run: |
          set -euo pipefail
          test -f docker-compose.yml
          test -f Makefile || true
          test -d nginx || true
          test -d scripts || true
          echo "Repo structure OK."

      # Lint GitHub Actions workflows (catches YAML + action errors)
      - name: actionlint (GitHub Actions linter)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_on_error: true

      # Lint YAML files (docker-compose, workflows, configs)
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy: disable

      # Shell script static analysis (scripts/*.sh)
      - name: ShellCheck (bash scripts)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "scripts"

      # Secret scanning (stop accidental credential leaks)
      - name: Gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # optional; can be omitted

      # IaC security scanning (Terraform/K8s/YAML/Docker etc.)
      - name: Checkov (IaC/Security misconfig)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          framework: all
          soft_fail: false # set true if you prefer warning-only on early stage

      # Container/IaC config scanning (Dockerfile, compose, k8s, etc.)
      - name: Trivy - config scan (misconfigurations)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-config.sarif"

      - name: Upload Trivy config results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-config.sarif"

      # Dependency + file system scan (catch vulnerable libs and binaries)
      - name: Trivy - filesystem scan (deps & vulns)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-fs.sarif"

      - name: Upload Trivy FS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-fs.sarif"

      # Optional: Generate SBOM (good for enterprise/procurement/compliance)
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

  smoke-compose:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-security
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: GitHub runner won't have NVIDIA GPU.
      # We validate compose syntax and do a "no-GPU" safe boot strategy.
      - name: Prepare no-GPU compose override (CI-safe)
        run: |
          set -euo pipefail
          cat > docker-compose.ci.override.yml <<'YAML'
          services:
            ollama:
              # CI runners have no GPU. Remove GPU reservation so compose can validate/start.
              deploy: {}
          YAML

      - name: Docker Compose config validation
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml config >/dev/null
          echo "Compose config is valid."

      # Optional: bring up nginx only to ensure config doesn't crash
      - name: Nginx config test (container)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t
          echo "Nginx config OK."
