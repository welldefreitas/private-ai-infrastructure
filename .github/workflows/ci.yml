---
# ============================================================
# Enterprise CI/CD Pipeline for Private AI Infrastructure
#
# This pipeline enforces production-grade quality gates:
#
# • YAML lint validation
# • Shell script security lint
# • GitHub Actions workflow validation
# • Vulnerability scanning
# • Docker compose smoke test
#
# This ensures the infrastructure is:
# Secure
# Reliable
# Deployable
# Enterprise-ready
# ============================================================

name: Enterprise CI/CD Pipeline

# ------------------------------------------------------------
# When this pipeline runs
# ------------------------------------------------------------

on:

  # Run on every push
  push:
    branches:
      - main

  # Run on Pull Requests
  pull_request:

  # Allow manual execution
  workflow_dispatch:


jobs:

# ============================================================
# JOB 1 — Lint and Security Validation
# ============================================================

  lint-security:

    name: Lint + Security Gates

    runs-on: ubuntu-latest


    steps:

    # --------------------------------------------------------
    # Checkout repository code
    # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


    # --------------------------------------------------------
    # Install yamllint
    # --------------------------------------------------------

      - name: Install yamllint
        run: |
          pip install yamllint


    # --------------------------------------------------------
    # Validate YAML syntax
    # --------------------------------------------------------

      - name: YAML lint validation
        run: |
          yamllint .


    # --------------------------------------------------------
    # Install ShellCheck
    # --------------------------------------------------------

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install shellcheck -y


    # --------------------------------------------------------
    # Scan shell scripts for security issues
    # --------------------------------------------------------

      - name: Shell script lint
        run: |
          shellcheck scripts/*.sh


    # --------------------------------------------------------
    # Install Actionlint
    # Validates GitHub workflows
    # --------------------------------------------------------

      - name: Install actionlint
        run: |
          curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash


    # --------------------------------------------------------
    # Validate GitHub workflows syntax
    # --------------------------------------------------------

      - name: Validate GitHub workflows
        run: |
          ./actionlint


    # --------------------------------------------------------
    # Install Trivy
    # Vulnerability scanner
    # --------------------------------------------------------

      - name: Install Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
          https://aquasecurity.github.io/trivy-repo/deb \
          $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update

          sudo apt-get install trivy -y


    # --------------------------------------------------------
    # Scan repository for vulnerabilities
    # --------------------------------------------------------

      - name: Security vulnerability scan
        run: |
          trivy fs --exit-code 1 --severity HIGH,CRITICAL .


# ============================================================
# JOB 2 — Docker Compose Smoke Test
# ============================================================

  docker-test:

    name: Compose Smoke Test (CI-safe)

    runs-on: ubuntu-latest

    needs: lint-security


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Validate docker-compose syntax
        run: |
          docker compose config
