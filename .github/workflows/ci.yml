name: Enterprise CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Minimal permissions (security best practice)
permissions:
  contents: read

jobs:
  lint_security_gates:
    name: Lint + Security Gates
    runs-on: ubuntu-latest

    steps:
      # --- Source checkout ----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- YAML lint (compose, workflows, config files) ----------------------
      - name: Setup Python (for yamllint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: YAML lint
        run: |
          yamllint -f colored .

      # --- Shell scripts lint -------------------------------------------------
      # Note: ShellCheck catches real production bugs early.
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck (bash scripts)
        run: |
          # Quote everything to avoid SC2086 and word-splitting
          if find "./scripts" -type f -name "*.sh" -print -quit | grep -q .; then
            find "./scripts" -type f -name "*.sh" -print0 | xargs -0 shellcheck
          else
            echo "No scripts found under ./scripts — skipping."
          fi

      # --- GitHub Actions workflow lint --------------------------------------
      # IMPORTANT: rhysd/actionlint is a tool; reviewdog provides the action wrapper.
      - name: Actionlint (workflows)
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # --- Docker Compose sanity check (CI-safe, no heavy pulls) --------------
      - name: Docker Compose config validation
        run: |
          docker compose -f "./docker-compose.yml" config > /dev/null

      # --- Nginx config validation (small image pull, worth it) ---------------
      - name: Nginx config syntax test
        run: |
          docker run --rm \
            -v "${PWD}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine nginx -t

      # --- Trivy filesystem scan (high/critical gate) ------------------------
      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"

  compose_smoke_test:
    name: Compose Smoke Test (CI-safe)
    runs-on: ubuntu-latest
    needs: lint_security_gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We only validate the structure; we do NOT boot ollama (heavy image).
      - name: Smoke test (compose config)
        run: |
          docker compose -f "./docker-compose.yml" config > /dev/null
          echo "Compose file parsed successfully (CI-safe)."
