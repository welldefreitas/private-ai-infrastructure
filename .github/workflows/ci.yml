name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  lint-security-gates:
    name: Lint + Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- YAML lint (compose + workflow YAMLs) ----
      - name: Setup Python (for yamllint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: YAML lint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 140}}}" .

      # ---- Shell lint (scripts/) ----
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck (bash scripts)
        run: |
          shellcheck scripts/*.sh

      # ---- GitHub Actions workflow lint (NO third-party tag dependency) ----
      - name: Setup Go (for actionlint)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: actionlint (workflows)
        run: |
          actionlint -color

      # ---- Basic security scan (filesystem + config) using Trivy container ----
      - name: Trivy - filesystem scan (high/critical gate)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --security-checks vuln,config,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /repo

  compose-smoke:
    name: Compose Smoke Test (CI-safe)
    runs-on: ubuntu-latest
    needs: lint-security-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI runners don't have GPU; we validate compose config + run minimal up/down.
      - name: Docker Compose config validate
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q

      - name: Compose up (CI override)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          docker compose ps

      - name: Basic health check (containers running)
        run: |
          # Fail if any container is not running
          test -z "$(docker compose ps --status=exited -q)"

      - name: Compose down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
