name: Security & Linting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run ShellCheck for bash scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

      - name: Validate docker-compose.yml
        run: docker-compose config -q
